name: PR ws-objects → migracion

on:
  push:
    branches:
      - desarrollo/feature/ws-objects

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crear Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: migracion
          head: desarrollo/feature/ws-objects
          title: "Auto PR: ws-objects → migracion"
          body: "PR generado automáticamente al hacer push en ws-objects"
